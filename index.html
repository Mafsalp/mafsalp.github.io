 on an ITIL-aligned model with incident, change and problem management, monitoring, SLAs and continuous improvement.`,`Own vendor selection, commercial evaluation and architecture decisions, manage infrastructure cost across on-premises and cloud, and build investment cases for leadership.`,`Built resilience through disaster recovery and business continuity planning, and set security baselines across the network, endpoint and identity layers.`,`Defined the capability roadmap and team structure, including future skills in automation and AI-enabled operations, and partner with executive leadership on infrastructure investment.`]},{role:`Infrastructure Specialist`,org:`Abu Dhabi Chamber of Commerce`,place:`Abu Dhabi, UAE`,period:`Apr 2023 – May 2025`,summary:`Led a cybersecurity engineering uplift across network, endpoint, identity and detection layers while directing a data centre modernisation.`,points:[`Raised the security posture across network, endpoint, identity and detection, hardening endpoints and strengthening perimeter protection.`,`Directed the data centre modernisation to hyperconverged infrastructure with minimal downtime, refreshing compute, storage and network.`,`Managed the infrastructure lifecycle across compute, storage and networking, and expanded cloud adoption to improve scalability and cost.`,`Standardised identity, access and device compliance, and put in monitoring to improve uptime and performance across critical systems.`]},{role:`IT Infrastructure Engineer (onsite at Global Village)`,org:`Tech Mahindra`,place:`Dubai, UAE`,period:`Mar 2022 – Apr 2023`,summary:`Client-facing technical lead for a large entertainment destination under a managed-services contract, continuing the data centre, network and security programme below.`,points:[`Managed a 100+ virtual server estate across cloud and on-premises, keeping high availability throughout.`,`Kept the integrations behind customer-facing systems running and built network failover for applications that could not afford downtime.`]},{role:`IT Infrastructure Engineer`,org:`Global Village LLC`,place:`Dubai, UAE`,period:`Apr 2019 – Feb 2022`,summary:`Owned the end-to-end design, delivery and lifecycle of the data centre and network for a large-scale entertainment destination, and built its cybersecurity engineering capability.`,points:[`Built the site's cybersecurity engineering capability, covering network security, endpoint protection, access control and threat detection.`,`Designed enterprise LAN and WAN across multiple assets, with resilient design, next-generation firewalls and network access control across 30+ distribution frames with full failover.`,`Ran virtualisation and platform optimisation across 100+ virtual servers spanning on-premises and cloud, with disaster recovery and centralised backup.`,`Established 24x7 monitoring, incident management and change control to keep critical systems available through the peak season.`,`Managed multiple vendors and contractors across concurrent workstreams, including telecom and service partners.`]},{role:`Support Engineer, ICT and Cloud`,org:`EMTECH Computers LLC`,place:`UAE`,period:`Oct 2016 – Apr 2019`,summary:`Designed, implemented and maintained IT infrastructure across messaging, directory services and virtualisation for several enterprise clients.`,points:[`Led a 1,400-user enterprise email migration to Microsoft 365, including a tenant-to-tenant consolidation.`,`Delivered server virtualisation, high-availability clustering, and enterprise backup and disaster recovery.`]},{role:`Project Engineer`,org:`Gemini Communication`,place:`India`,period:`Jul 2015 – Jul 2016`,summary:`Network and systems project delivery for enterprise clients.`,points:[]},{role:`Linux Network Administrator (Trainee)`,org:`IPSR IT Solutions`,place:`India`,period:`May 2014 – May 2015`,summary:`Where it started: Linux, networking and systems administration.`,points:[]}],g=[{tag:`Security`,icon:`shield`,title:`Microsoft security stack: XDR, Sentinel and Purview`,body:`Deployed Defender for Cloud, XDR, Sentinel and Purview as a single operations platform, with DLP, compliance and privacy policy set to UAE regulatory requirements.`,metrics:[[`4`,`Tools, one platform`],[`Real time`,`Threat detection`]],stack:[`Defender for Cloud`,`XDR`,`Sentinel`,`Purview`,`DLP`]},{tag:`Migration`,icon:`server`,title:`VxRail data centre modernisation`,body:`Ran a full data centre migration to VxRail hyperconverged infrastructure. Moved 100+ virtual servers without interrupting operations.`,metrics:[[`100+`,`VMs migrated`],[`Zero`,`Critical incidents`]],stack:[`Dell VxRail`,`VMware ESXi`,`Hyper-V`,`Storage`,`Networking`]},{tag:`Microsoft 365`,icon:`mail`,title:`1,400-user Office 365 migration`,body:`Planned and ran a 1,400-user move to Microsoft 365. It went Zimbra to O365 first, then a tenant-to-tenant consolidation, covering Exchange, directory sync and end-user change management.`,metrics:[[`1,400+`,`Users migrated`],[`Zero`,`Critical failures`]],stack:[`Microsoft 365`,`Exchange`,`Active Directory`,`Entra Connect`]},{tag:`Network`,icon:`network`,title:`Enterprise network and NAC, 30+ frames`,body:`Built and secured the network across 30+ distribution frames with full failover. Forescout NAC handled access control and a next-generation firewall sat on a busy public perimeter.`,metrics:[[`30+`,`Frames with failover`],[`NAC`,`Access control`]],stack:[`Forescout NAC`,`FortiGate`,`CheckPoint`,`Cisco Catalyst`]}],_=[`Security`,`Migration`,`Microsoft 365`,`Network`],v={tag:`Featured · AEGI Holding`,icon:`cloud`,title:`Building a secure cloud foundation from a greenfield start`,challenge:`A new multi-entity holding group across visa services, insurance, gold mining and aviation, with no existing IT platform, no operating model and no security baseline. Everything had to be built, automated, and able to run at scale.`,approach:[`Defined the enterprise infrastructure and cloud strategy: a hybrid and multi-cloud direction across the major hyperscalers, modernising legacy toward cloud-native platforms.`,`Drove Infrastructure-as-Code and automation to speed up deployment and cut manual operations, on an ITIL-aligned service model with monitoring and SLAs.`,`Set security baselines across network, endpoint and identity, with disaster recovery and business continuity built in.`],outcomes:[[`Greenfield`,`Platform built and running at scale`],[`Hybrid + multi-cloud`,`Strategy across major hyperscalers`],[`IaC + automation`,`Manual operations reduced`],[`DR + BCP`,`Resilience and security baselines in place`]],stack:[`Azure`,`Entra ID`,`Intune`,`Defender`,`Sentinel`,`Terraform (IaC)`,`ITIL`,`Multi-cloud`]},y=[{label:`Cloud and Platforms`,items:[`Microsoft Azure`,`Multi-cloud strategy`,`Entra ID`,`Infrastructure-as-Code`,`Microsoft 365`]},{label:`Cybersecurity`,items:[`Zero Trust`,`Defender XDR`,`Microsoft Sentinel`,`Identity and access`,`Vulnerability management`]},{label:`Infrastructure and Resilience`,items:[`VMware`,`Dell VxRail`,`Hyper-V`,`Backup and DR`,`Enterprise networking`]},{label:`Operations and FinOps`,items:[`ITIL service management`,`Monitoring and SLAs`,`Automation`,`Cost and FinOps`]},{label:`Leadership`,items:[`Strategy and roadmap`,`Vendor management`,`Team leadership`,`Executive engagement`]}],b=[{title:`Building Zero Trust in enterprise environments`,blurb:`Phasing Zero Trust across multiple entities without breaking the business along the way.`},{title:`Azure landing zones explained`,blurb:`Designing hub-and-spoke landing zones that scale and stay governable.`},{title:`Why identity is the new perimeter`,blurb:`Why modern security starts with identity, not the network edge.`},{title:`Lessons from a 1,400-user M365 migration`,blurb:`What a large tenant-to-tenant Microsoft 365 move actually takes end to end.`},{title:`Disaster recovery is more than backup`,blurb:`Recovery objectives, testing and continuity, not just a copy of the data.`},{title:`Infrastructure leadership in th
