.`,items:[`Cloud and infrastructure strategy`,`Legacy modernisation`,`Cloud-native and hybrid`,`Multi-cloud (Azure, AWS, GCP)`,`Azure landing zones`]},{code:`02`,title:`Cybersecurity Engineering`,body:`Hands-on, technical security across network, endpoint and identity. EDR and XDR, Zero Trust, SIEM and threat detection, with security built into the platform rather than bolted on afterwards.`,items:[`Network and NGFW security`,`Endpoint and EDR/XDR`,`Identity and access`,`Zero Trust`,`SIEM and threat detection`,`Vulnerability management`]},{code:`03`,title:`Automation, FinOps and Operations`,body:`Infrastructure-as-Code and automation to cut manual work, ITIL-aligned service management with monitoring and SLAs, and infrastructure cost managed across on-premises and cloud.`,items:[`Infrastructure-as-Code`,`Automation`,`ITIL service management`,`Monitoring and SLAs`,`FinOps and TCO`]},{code:`04`,title:`Leadership and Delivery`,body:`Building the teams and the operating model behind delivery, owning vendor and architecture decisions, and turning investment cases into decisions leadership can act on.`,items:[`Team and capability building`,`Vendor ecosystem management`,`Executive engagement`,`Investment cases and ROI`,`Talent roadmap`]}],h=[{role:`Infrastructure and Cloud Lead`,org:`AEGI Holding`,place:`Abu Dhabi, UAE`,period:`Jun 2025 – Present`,current:!0,summary:`I lead the infrastructure, cloud and cybersecurity engineering function for a multi-entity holding group with interests in visa services, insurance, gold mining and aviation, setting the technical strategy and standards across the business.`,points:[`Defined the enterprise infrastructure and cloud strategy, including a hybrid and multi-cloud direction across the major hyperscalers, and started modernising legacy environments toward cloud-native platforms.`,`Drove Infrastructure-as-Code and automation to speed up deployment, improve consistency and cut manual operations.`,`Run service delivery on an ITIL-aligned model with incident, change and problem management, monitoring, SLAs and continuous improvement.`,`Own vendor selection, commercial evaluation and architecture decisions, manage infrastructure cost across on-premises and cloud, and build investment cases for leadership.`,`Built resilience through disaster recovery and business continuity planning, and set security baselines across the network, endpoint and identity layers.`,`Defined the capability roadmap and team structure, including future skills in automation and AI-enabled operations, and partner with executive leadership on infrastructure investment.`]},{role:`Infrastructure Specialist`,org:`Abu Dhabi Chamber of Commerce`,place:`Abu Dhabi, UAE`,period:`Apr 2023 – May 2025`,summary:`Led a cybersecurity engineering uplift across network, endpoint, identity and detection layers while directing a data centre modernisation.`,points:[`Raised the security posture across network, endpoint, identity and detection, hardening endpoints and strengthening perimeter protection.`,`Directed the data centre modernisation to hyperconverged infrastructure with minimal downtime, refreshing compute, storage and network.`,`Managed the infrastructure lifecycle across compute, storage and networking, and expanded cloud adoption to improve scalability and cost.`,`Standardised identity, access and device compliance, and put in monitoring to improve uptime and performance across critical systems.`]},{role:`IT Infrastructure Engineer (onsite at Global Village)`,org:`Tech Mahindra`,place:`Dubai, UAE`,period:`Mar 2022 – Apr 2023`,summary:`Client-facing technical lead for a large entertainment destination under a managed-services contract, continuing the data centre, network and security programme below.`,points:[`Managed a 100+ virtual server estate across cloud and on-premises, keeping high availability throughout.`,`Kept the integrations behind customer-facing systems running and built network failover for applications that could not afford downtime.`]},{role:`IT Infrastructure Engineer`,org:`Global Village LLC`,place:`Dubai, UAE`,period:`Apr 2019 – Feb 2022`,summary:`Owned the end-to-end design, delivery and lifecycle of the data centre and network for a large-scale entertainment destination, and built its cybersecurity engineering capability.`,points:[`Built the site's cybersecurity engineering capability, covering network security, endpoint protection, access control and threat detection.`,`Designed enterprise LAN and WAN across multiple assets, with resilient design, next-generation firewalls and network access control across 30+ distribution frames with full failover.`,`Ran virtualisation and platform optimisation across 100+ virtual servers spanning on-premises and cloud, with disaster recovery and centralised backup.`,`Established 24x7 monitoring, incident management and change control to keep critical systems available through the peak season.`,`Managed multiple vendors and contractors across concurrent workstreams, including telecom and service partners.`]},{role:`Support Engineer, ICT and Cloud`,org:`EMTECH Computers LLC`,place:`UAE`,period:`Oct 2016 – Apr 2019`,summary:`Designed, implemented and maintained IT infrastructure across messaging, directory services and virtualisation for several enterprise clients.`,points:[`Led a 1,400-user enterprise email migration to Microsoft 365, including a tenant-to-tenant consolidation.`,`Delivered server virtualisation, high-availability clustering, and enterprise backup and disaster recovery.`]},{role:`Project Engineer`,org:`Gemini Communication`,place:`India`,period:`Jul 2015 – Jul 2016`,summary:`Network and systems project delivery for enterprise clients.`,points:[]},{role:`Linux Network Administrator (Trainee)`,org:`IPSR IT Solutions`,place:`India`,period:`May 2014 – May 2015`,summary:`Where it started: Linux, networking and systems administration.`,points:[]}],g=[{tag:`Security`,title:`Microsoft security stack: XDR, Sentinel and Purview`,body:
